name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      # Only normalize.py is exercised here — it's the pure logic with no
      # PySpark/JVM or Apify dependency. ingest.py needs a live Apify token
      # and transform.py needs a JVM + PySpark install, so neither is
      # practical to run in CI; they're covered by local smoke-testing
      # instead (see README > Testing).
      - run: pytest -v
